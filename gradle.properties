# The generated surface is large (~1670 files). Run the Kotlin compiler in-process in
# the Gradle daemon (a single heap that fits available RAM) rather than a second daemon,
# and give that daemon enough heap to compile the whole surface without GC thrash.
org.gradle.jvmargs=-Xmx5g
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
# kotlin-sdkgen 0.4.0 restores configuration-cache reuse (ADR 0022 D5 wires generated sources without capturing a
# task-output provider). Re-enabled and validated: the exit-gate task graph (verificationCheck, samplesCheck,
# apiCheck, the sdkgenDiff/ktlint JavaExec tasks) is configuration-cache compatible (argumentProviders + doFirst
# defer every property/env read to execution). Problems fail the build so a regression cannot silently disable reuse.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
kotlin.code.style=official

# Kotlin build reports (KGP-native) feed the compile-time budget (scripts/measure-compile.sh reads the JSON report's
# per-task durations); no HTML parsing. The report is written under build/reports/kotlin-build on every build.
kotlin.build.report.output=json
kotlin.build.report.json.directory=build/reports/kotlin-build

# Single source of truth for the published version (ADR 0006: root + every target + the testing artifact share it).
# Change it only through `python3 scripts/release-version.py set <version>`, which also updates SDK_VERSION.
openrouter.version=0.1.0-rc.1
