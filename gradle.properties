# The generated surface is large (~1670 files). Run the Kotlin compiler in-process in
# the Gradle daemon (a single heap that fits available RAM) rather than a second daemon,
# and give that daemon enough heap to compile the whole surface without GC thrash.
org.gradle.jvmargs=-Xmx5g
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
# The published kotlin-sdkgen 0.3.0 plugin is not configuration-cache safe: the
# generate->compile provider wiring (KotlinCompile.javaSourceFiles reads the
# generator's mapped outputDirectory) cannot be serialized. Build cache stays on.
org.gradle.configuration-cache=false
kotlin.code.style=official
