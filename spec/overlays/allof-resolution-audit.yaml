overlay: 1.1.0
info:
  title: OpenRouter audited allOf-resolution overrides
  version: 1.2.0
# Audited overrides select the refined protocol-specific allOf branch for object-merge conflicts.
# Re-audited 2026-08-29 for the re-pinned contract (sha256 b2a4948a…, 101 operations). The Responses GA
# reshaping (upstream changelog Jul 25) drifted nine content digests; each was re-derived mechanically from
# the generator's own diagnostics (the "matched 0" candidate inlineSchemaSha256 for branch election, and the
# "expected …" propertySchemaSha256 for the resolved property). In every case allOf/0 remained the base $ref
# and allOf/1 the refined inline branch — branch order did not change upstream, only the branch content.
# The TextDeltaEvent/TextDoneEvent logprobs branch (119f0284…) did not drift and is unchanged.
#
# Re-audited 2026-08-30 for the additive-cosine re-pin (sha256 e88b0cec…, 101 operations). Upstream added a
# `cosine` object property to the `usage.source` inline schema (and `cosine`/`Cosine` enum values elsewhere).
# That additive change re-derived the affected `usage.source` inlineSchemaSha256 digest(s); each new digest was
# taken verbatim from the generator's own "matched 0" candidate diagnostic. No branch order or strategy changed,
# only the inline branch content, and the effect on generated code is purely additive (the new `cosine` field).
#
# Re-audited 2026-09-09 for the d49dda78 re-pin (sha256 d49dda78…, 105 operations). Two changes: (1) every
# drifted inlineSchemaSha256/propertySchemaSha256 was re-derived verbatim from the generator's own "matched 0"
# / "expected …" diagnostics, applied innermost-first to a fixed point (28→26→22→15→0 blocking over 5 rounds);
# the TextDeltaEvent/TextDoneEvent logprobs branch (119f0284…) again did not drift. (2) Upstream added
# `server_tool_use: $ref ORAnthropicServerToolUsage` to the refined inline `usage` branch of MessagesResult,
# conflicting with BaseMessagesResult.usage's AnthropicUsage.server_tool_use. The new NESTED action on
# MessagesResult.allOf[1].properties.usage elects the OpenRouter-specific inline branch — a breaking type change
# on MessagesResult.usage.serverToolUse (AnthropicServerToolUsage → ORAnthropicServerToolUsage), the upstream
# intent. No generator change and no new waiver were required.
actions:
  - target: "$['components']['schemas']['MessagesResult']"
    update:
      x-sdkgen-allof-resolution:
        properties:
          usage:
            strategy: unionSupersede
            source:
              inlineSchemaSha256: "817b059ddc1bfd79cb47d24a6ad634e55a4740c8ce439f14615a4a062f345df3"
              propertySchemaSha256: "3373abce414168fb4fba44747b7dd557abb93a01768b4f0dabcbebc996b8d810"
  # 2026-09-09 (d49dda78 re-pin): upstream added `server_tool_use: $ref ORAnthropicServerToolUsage` to the
  # refined inline `usage` branch (MessagesResult.allOf[1].properties.usage.allOf[1]), conflicting with
  # BaseMessagesResult.usage's AnthropicUsage.server_tool_use. This nested action elects the OpenRouter-specific
  # inline branch (ORAnthropicServerToolUsage). Digests filled from the generator's own election diagnostic.
  - target: "$['components']['schemas']['MessagesResult']['allOf'][1]['properties']['usage']"
    update:
      x-sdkgen-allof-resolution:
        properties:
          server_tool_use:
            strategy: unionSupersede
            source:
              inlineSchemaSha256: "b53dff37c650e36c602509a7f5fdfd408a260a5c2f2fef705e754eac760ff769"
              propertySchemaSha256: "6e330469fda5cda8fa073408b18105726e47046e71517793498082ae9f35d4ea"
  - target: "$['components']['schemas']['OpenResponsesResult']"
