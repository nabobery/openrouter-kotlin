# A stale build cache would mask a resolution defect, so caching is off; the version under test is passed on the
# command line (-PopenrouterVersion=).
org.gradle.configuration-cache=true
org.gradle.caching=false
kotlin.code.style=official
# The Apple/Native executable links are memory-heavy; give the (single-use) daemon enough heap to avoid GC thrashing.
org.gradle.jvmargs=-Xmx4g
