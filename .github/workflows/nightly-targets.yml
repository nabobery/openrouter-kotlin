name: Nightly targets

# Runtime lanes for the deprecated Intel Apple targets (macosX64, iosX64), which are retained compile-only on PRs
# and exercised here on an Intel macOS runner. Nightly (and on demand) rather than per-PR: macos-15-intel is a paid
# runner and these targets are deprecated upstream (Kotlin 2.3.20). See docs/adr/0007-final-target-tiers-for-1-0.md.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intel-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # On an Intel macOS host the host-aware gate runs macosX64Test and iosX64Test (the Intel simulator lane),
      # plus jvmTest and jsNodeTest. "iPhone 16" exists on the macos-15 Xcode 16 image.
      - name: Host-aware verification gate on Intel macOS (macosX64Test + iosX64Test)
        run: ./gradlew :sdk:verificationCheck -Popenrouter.iosSimulator="iPhone 16" --console=plain
