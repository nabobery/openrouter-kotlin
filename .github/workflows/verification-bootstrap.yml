name: Dependency verification bootstrap

# Dispatch-only. Regenerates the per-host sha256 dependency-verification metadata on a COLD cache on every
# supported CI host, then uploads each host's dry-run file as an artifact. A maintainer downloads the four
# artifacts, merges them with `scripts/merge-verification-metadata.py` into `gradle/verification-metadata.xml`,
# reviews the diff (the review IS the trust decision — the bootstrap trusts whatever resolves from the declared
# repositories), and commits the merged file. See docs/security-and-privacy.md and CONTRIBUTING.md.
#
# This workflow holds NO secrets and is read-only (`contents: read`); it must never write to the repo.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bootstrap:
    name: sha256 metadata (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # A COLD cache is essential: a warm cache omits already-downloaded artifacts from the metadata (gradle#19228).
          cache-disabled: true
      # Write sha256 checksums for the host-aware dependency set. --dry-run keeps it read-only (the task graph is
      # calculated — resolving the configurations — but no task executes and nothing is published), and in that
      # mode Gradle writes `gradle/verification-metadata.dryrun.xml`. NOTE: dry-run captures configuration-resolved
      # dependencies; Gradle documents that it does NOT capture dependencies resolved only during task *execution*.
      # The maintainer reviews the merged diff and, if an execution-only dependency is missing on some host,
      # supplements it with an executing pass (drop `--dry-run`) on that host. See CONTRIBUTING.md.
      - name: Write sha256 verification metadata (cold cache, dry run)
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          ./gradlew \
            :sdk:verificationCheck :openrouter-kotlin-testing:verificationCheck samplesCheck \
            publishAllPublicationsToStagingRepository \
            --write-verification-metadata sha256 --dry-run --stacktrace
          # Rename the per-host dry-run file so the four host artifacts never collide on merge.
          mv gradle/verification-metadata.dryrun.xml "gradle/verification-metadata.${MATRIX_OS}.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-metadata-${{ matrix.os }}
          path: gradle/verification-metadata.${{ matrix.os }}.xml
          if-no-files-found: error
