name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository. Grant more per-job only if a
# job genuinely needs it (none do today).
permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (version tags are mutable). The trailing
      # comment records the human-readable release each SHA corresponds to.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Regenerate from the pinned spec and assert the produced surface reproduces the
      # committed baseline (spec/generated.lock.json) byte-for-byte. Generated sources are
      # not checked in (plugin-native model); this is the drift gate that replaces a
      # `git diff` over a checked-in tree.
      - name: Generation drift gate
        run: ./scripts/check-drift.sh

      # The coverage dashboard is generated from the generated clients; regenerate it and fail if it
      # drifts from the committed copy (run `python3 scripts/coverage-dashboard.py` locally to refresh).
      - name: Operation coverage dashboard freshness
        run: |
          python3 scripts/coverage_dashboard_test.py
          python3 scripts/coverage-dashboard.py
          git diff --exit-code -- docs/coverage/operation-coverage.md

      # Linux-runnable subset of the exit gate: JVM test lane (the fake-transport smoke
      # test), JS cross-compile, and the JVM binary-compatibility check (apiCheck; klib /
      # native ABI validation is not run here). The macOS/iOS lanes run in build-apple.
      - name: Test (JVM), compile JS, API check, ktlint
        run: ./gradlew :sdk:jvmTest :sdk:compileKotlinJs :sdk:apiCheck :sdk:ktlintCheck --console=plain

      # Tier 2 native: compile all three targets (linuxX64/linuxArm64/mingwX64) and run the linuxX64 test
      # lane natively on ubuntu (common + engineTest). linuxArm64/mingwX64 have no runner, so compile-only.
      - name: Tier 2 native compile + linuxX64 test lane
        run: ./gradlew :sdk:compileKotlinLinuxX64 :sdk:compileKotlinLinuxArm64 :sdk:compileKotlinMingwX64 :sdk:linuxX64Test --console=plain

      # Compile the JVM and JS sample consumers (no network). The macOS-native sample compiles in build-apple
      # (via samplesCheck); the Android sample compiles only when the runner's Android SDK made it part of the
      # build (ubuntu runners ship one, so this includes it opportunistically).
      - name: Compile sample consumers (JVM, JS)
        run: ./gradlew :samples:jvm:compileKotlin :samples:js:compileKotlinJs --console=plain

      - name: Assemble Android sample (when an Android SDK is present)
        if: env.ANDROID_HOME != ''
        run: ./gradlew :samples:android:assembleDebug --console=plain

  build-apple:
    # The full, host-safe verification gate. verificationCheck compiles every declared target
    # (JVM, JS, iosArm64, iosSimulatorArm64, iosX64, macosArm64, macosX64), runs the
    # runnable test lanes (JVM + macosArm64), and checks the public API baseline. iOS and
    # non-host macOS targets are compile-only (no device/simulator execution).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: SDK verification + sample compile (all targets, JVM + macOS tests, API check, samples)
        run: ./gradlew :sdk:verificationCheck samplesCheck --console=plain
