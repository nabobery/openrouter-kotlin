name: Live

# Opt-in live smoke test against the real OpenRouter API. Nightly + manual only — never on pull requests or
# forks. The OPENROUTER_API_KEY secret MUST be a dedicated, least-privileged key with a spend limit; PRs and forks
# never receive it (the job is gated to the canonical repository).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    if: github.repository == 'nabobery/openrouter-kotlin'
    runs-on: ubuntu-latest
    env:
      OPENROUTER_LIVE_TESTS: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      # Actions pinned to full commit SHAs (version tags are mutable); the trailing comment records the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Fail fast (before spinning up Gradle) if the secret is missing: GitHub resolves an unset secret to the
      # empty string, so without this a misconfigured runner would otherwise run the test with a blank key.
      # (The test itself also enforces this, so the live drift signal cannot silently pass.)
      - name: Preflight — require the live API key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is unset or empty; the live smoke test cannot run." >&2
            exit 1
          fi

      - name: Live smoke tests (chat + management, budgeted)
        run: ./gradlew :sdk:jvmTest --tests "com.nabobery.openrouter.live.LiveChatSmokeTest" --tests "com.nabobery.openrouter.live.LiveManagementSmokeTest" --console=plain
