name: Live

# Opt-in live smoke test against the real OpenRouter API. Nightly + manual only — never on pull requests or
# forks. The OPENROUTER_API_KEY secret MUST be a dedicated, least-privileged key with a spend limit; PRs and forks
# never receive it (the job is gated to the canonical repository).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    if: github.repository == 'nabobery/openrouter-kotlin'
    runs-on: ubuntu-latest
    env:
      OPENROUTER_LIVE_TESTS: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      # Actions pinned to full commit SHAs (version tags are mutable); the trailing comment records the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Scheduled live validation is optional until the repository secret is provisioned. Keep the workflow green
      # and explicit when it is unavailable; once opted in, the tests still fail closed on a blank key.
      - name: Preflight — detect the live API key
        id: live-preflight
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENROUTER_API_KEY is unset or empty; skipping the optional live smoke test."
            echo "### Live smoke test skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure OPENROUTER_API_KEY as a repository secret to enable this scheduled check." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Live smoke tests (chat + management, budgeted)
        if: steps.live-preflight.outputs.run == 'true'
        run: ./gradlew :sdk:jvmTest --tests "com.nabobery.openrouter.live.LiveChatSmokeTest" --tests "com.nabobery.openrouter.live.LiveManagementSmokeTest" --console=plain
