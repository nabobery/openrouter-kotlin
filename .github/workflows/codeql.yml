name: CodeQL

# Weekly Kotlin/Java static analysis. Manual build mode compiles the JVM surface, then CodeQL analyzes it.
# Capped at 90 minutes; if it cannot finish the generated surface, drop the schedule (keep dispatch) and record
# the gap (docs/security-and-privacy.md).
on:
  schedule:
    - cron: "42 2 * * 1" # weekly, Monday 02:42 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write # upload CodeQL results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build the JVM surface for CodeQL
        run: ./gradlew :sdk:compileKotlinJvm --console=plain
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:java-kotlin"
