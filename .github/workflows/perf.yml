name: Performance

# Runtime budgets (first-event latency, 200-event decode time, and allocation/event via the JMH gc profiler) from
# the kotlinx-benchmark suite in :benchmarks, over the deterministic fake transport. Nightly and on demand only —
# never on PRs (benchmarks are slow and hosted-runner numbers are noisy). The JVM job GATES against
# docs/budgets/runtime.json (+100%); the adapter is scripts/bench-to-runtime.py.

on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC daily (after nightly-targets)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench-jvm-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # JVM runtime + allocation gate. Build the JMH jar and run it with the `gc` profiler so the report carries
      # `gc.alloc.rate.norm` (allocation/event); the adapter folds the report into runtime.json's schema and the
      # budget checker gates it (+100% — latency is host-noisy; allocation is host-stable, so the ceiling still
      # catches real regressions). budgets_test.py + bench_to_runtime_test.py guard the tooling first.
      - name: JVM runtime + allocation budget (kotlinx-benchmark + JMH gc profiler)
        run: |
          python3 scripts/budgets_test.py
          python3 scripts/bench_to_runtime_test.py
          mkdir -p build/budgets
          ./gradlew :benchmarks:jvmBenchmarkJar --console=plain
          java -jar benchmarks/build/benchmarks/jvm/jars/*.jar \
            -prof gc -f 1 -wi 5 -i 5 -w 1s -r 1s -rf json -rff build/budgets/bench-jvm.json
          python3 scripts/bench-to-runtime.py build/budgets/bench-jvm.json --out build/budgets/runtime.json
          python3 scripts/budgets.py check docs/budgets/runtime.json build/budgets/runtime.json --tolerance 1.0

      # Native benchmarks are trend-watched (no gc profiler on Native; hosted-runner native numbers are noisy), so
      # they are run and uploaded but not gated. runtime.json is the JVM budget.
      - name: Native benchmarks (linuxX64, trend only)
        run: ./gradlew :benchmarks:linuxX64Benchmark --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmarks-jvm-linux
          path: |
            benchmarks/build/reports/benchmarks/**/*.json
            build/budgets/bench-jvm.json
            build/budgets/runtime.json

  bench-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Benchmarks (macosArm64)
        run: ./gradlew :benchmarks:macosArm64Benchmark --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmarks-macos
          path: benchmarks/build/reports/benchmarks/**/*.json
