name: Scorecard

# OpenSSF Scorecard supply-chain posture check. Weekly + on push to main. Uploads SARIF to code scanning.
on:
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # OSSF Scorecard reads commit history via a GitHub App integration and publishes to the public OpenSSF API;
    # on a PRIVATE repository both fail ("Resource not accessible by integration"). Skip cleanly while the repo is
    # private so the push gate stays green, and activate automatically on the first push once it is published.
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read # job-level permissions REPLACE the workflow map, so this must be restated (checkout + Scorecard read the repo)
      security-events: write # upload the SARIF result to code scanning
      id-token: write # publish results to the OpenSSF API (publish_results)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
