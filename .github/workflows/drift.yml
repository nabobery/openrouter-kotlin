name: Spec drift

# Daily digest-based drift PR (ADR 0005). PRIVILEGE SPLIT: `detect` is unprivileged (contents: read, no secrets) and
# produces only DATA (a git patch + a Markdown report). `open-pr` is the only write-capable job; it applies the patch
# behind a path allowlist and never executes anything from the artifact (no ./gradlew, no scripts) except the
# repo-owned patch validator. Ordinary PR CI (unprivileged) re-validates the resulting pull request. Drift PRs never
# auto-merge and never publish.
on:
  schedule:
    - cron: "41 5 * * *" # daily 05:41 UTC (before nightly-targets 06:00)
  workflow_dispatch:
    inputs:
      open_pr:
        description: Open/update the drift PR when upstream changed (schedule runs always do).
        type: boolean
        default: true
      rehearse_from_ref:
        description: >-
          Rehearsal only — start from the spec/ + api dumps of this git ref (e.g. the 89-operation pin at afeef83)
          so the pipeline can be exercised end-to-end even when upstream is quiet. Never used on schedule.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: spec-drift
  cancel-in-progress: false

jobs:
  detect:
    name: Detect upstream drift and regenerate (unprivileged)
    # macOS so apiDump refreshes the klib ABI dump for every target (Linux cannot build the Apple klibs).
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      status: ${{ steps.refresh.outputs.status }}   # no-change | rebaselined | blocked
      from: ${{ steps.refresh.outputs.from }}
      to: ${{ steps.refresh.outputs.to }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Fetch, re-pin, regenerate, re-baseline
        id: refresh
        env:
          # Rehearsal runs inside a temporary git worktree at the given ref (drift-refresh.sh never rewrites the
          # checkout it was started from). The expression is passed through env, never interpolated into the script.
          DRIFT_WORKTREE: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearse_from_ref || '' }}
        run: |
          mkdir -p build/drift
          set +e; bash scripts/drift-refresh.sh | tee build/drift/refresh.log; rc=${PIPESTATUS[0]}; set -e
          case "$rc" in
            0)  echo "status=no-change" >> "$GITHUB_OUTPUT"; exit 0 ;;
            10) echo "status=rebaselined" >> "$GITHUB_OUTPUT" ;;
            20) echo "status=blocked" >> "$GITHUB_OUTPUT" ;;
            *)  echo "::error::drift-refresh.sh failed for a reason other than drift (exit $rc)"; exit 1 ;;
          esac
          sed -n 's/^CHANGED: \([0-9a-f]*\) -> \([0-9a-f]*\).*/from=\1\nto=\2/p' build/drift/refresh.log >> "$GITHUB_OUTPUT"
      - name: Gates on the regenerated tree (compile + JVM tests + API check)
        if: steps.refresh.outputs.status == 'rebaselined'
        run: ./gradlew :sdk:compileKotlinJvm :sdk:jvmTest :sdk:apiCheck --console=plain
      - name: Install oasdiff for the compatibility report
        if: steps.refresh.outputs.status != 'no-change'
        run: bash scripts/install-oasdiff.sh
      - name: Compatibility report (Track B; unavailable layers are reported, never faked)
        if: steps.refresh.outputs.status != 'no-change'
        run: bash scripts/compat-snapshot.sh --before build/drift/before --after build/drift/after --report build/drift/compat.md || true
      - name: Capture the patch (data only; rehearsal mode already wrote it from the worktree) and build the report
        if: steps.refresh.outputs.status != 'no-change'
        env:
          DRIFT_WORKTREE: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearse_from_ref || '' }}
        run: |
          if [ -z "$DRIFT_WORKTREE" ]; then
            git add -A -- spec sdk/api docs/coverage/operation-coverage.md docs/compat
            git diff --cached --no-renames --output=build/drift/drift.patch -- spec sdk/api docs/coverage/operation-coverage.md docs/compat
            git reset -q
          fi
          { echo "## Upstream spec drift"; echo; cat build/drift/refresh.log; echo; cat build/drift/compat.md 2>/dev/null; echo; echo "> Reviewer: add a CHANGELOG line under [Unreleased] › Changed › Contract before merging."; } > build/drift/report.md
          cat build/drift/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.refresh.outputs.status != 'no-change'
        with:
          name: drift
          path: |
            build/drift/drift.patch
            build/drift/report.md
            build/drift/problems-report.html
          if-no-files-found: error
          retention-days: 14

  open-pr:
    name: Open or update the drift PR (write-capable; applies DATA only)
    needs: detect
    if: >-
      needs.detect.outputs.status != 'no-change' &&
      (github.event_name == 'schedule' || inputs.open_pr == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # create-pull-request receives its token explicitly below
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: drift, path: drift }
      # The patch is untrusted DATA. A path allowlist alone is not a control: `git apply` can create symlinks
      # (mode 120000), set the executable bit, and apply binary hunks inside allowed directories, and PR CI only runs
      # AFTER this job has pushed the branch. So the patch is validated structurally (NUL-delimited raw paths, no
      # binary hunks, no mode/type changes, regular 100644 files only), applied to a TEMPORARY index, re-checked
      # from that index, and only then checked out into the tree. Python stdlib only; nothing from `drift/` runs.
      - name: Validate the patch structurally and against the path allowlist
        run: python3 scripts/validate-drift-patch.py drift/drift.patch
      - name: Apply into a temporary index, verify modes, then check out
        run: |
          set -eu
          export GIT_INDEX_FILE="$(mktemp)"
          git read-tree HEAD
          git apply --cached --check drift/drift.patch
          git apply --cached drift/drift.patch
          # Every entry TOUCHED BY THE PATCH must be a regular non-executable file (100644): no symlinks, no +x.
          # Scope the mode check to exactly the paths the patch changed (index-vs-HEAD), so the repository's own
          # tracked executables (gradlew, scripts/*.sh) are never misflagged.
          git diff --cached --name-only -z HEAD > "$RUNNER_TEMP/drift-touched"
          if [ -s "$RUNNER_TEMP/drift-touched" ] && \
             git ls-files -s -z --pathspec-from-file="$RUNNER_TEMP/drift-touched" --pathspec-file-nul \
               | tr '\0' '\n' | awk 'NF {print $1}' | grep -Ev '^100644$'; then
            echo "::error::non-regular or executable entries among patch-touched paths after apply"; exit 1
          fi
          git checkout-index -a -f
          unset GIT_INDEX_FILE
      - name: App token (optional — makes CI run unattended on the drift PR)
        id: app
        if: vars.DRIFT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DRIFT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DRIFT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          branch: automation/spec-drift
          delete-branch: true
          draft: ${{ needs.detect.outputs.status == 'blocked' }}
          labels: automation,drift${{ needs.detect.outputs.status == 'blocked' && ',drift:blocked' || '' }}
          commit-message: "spec: re-pin OpenRouter OpenAPI ${{ needs.detect.outputs.from }} → ${{ needs.detect.outputs.to }}"
          title: "spec: upstream OpenAPI drift ${{ needs.detect.outputs.from }} → ${{ needs.detect.outputs.to }}"
          body-path: drift/report.md
