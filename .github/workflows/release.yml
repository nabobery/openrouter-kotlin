name: Release

# Human-dispatched only. The tag v<version> must already exist on a reviewed main commit; the version is read from
# the commit itself (gradle.properties + SDK_VERSION) — never injected. Central upload is USER_MANAGED unless
# `publish: true`; a parked deployment is verified by the consumer matrix and then published (or dropped) by the operator.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must equal the tag without the leading v)"
        required: true
        type: string
      publish:
        description: "Publish the validated deployment automatically (false = park it for manual review)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: "${{ inputs.version }}"
      GIT_REF: "${{ github.ref }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Version grammar, tag, and ancestry
        run: |
          python3 scripts/release_version_test.py
          python3 scripts/release-version.py check --tag "v$RELEASE_VERSION"
          test "$GIT_REF" = "refs/tags/v$RELEASE_VERSION"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/changelog-extract.py "$RELEASE_VERSION" > /dev/null

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  stage-and-publish:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 240
    environment: maven-central
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: "${{ inputs.version }}"
      PUBLISH: "${{ inputs.publish }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Stage signed publications, inventory, consumer matrix, SBOM, bundle
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
          RELEASE_ARGS: "-Popenrouter.release=true"
          REQUIRE_SIGNATURES: "1"
        run: bash scripts/release-rehearsal.sh
      - name: Release notes
        run: python3 scripts/changelog-extract.py "$RELEASE_VERSION" > build/release-notes.md
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/central-bundle.zip
            build/publication-inventory.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/central-bundle.zip
          predicate-type: https://cyclonedx.org/bom
          predicate-path: build/sbom/bom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.version }}
          path: |
            build/central-bundle.zip
            build/publication-inventory.json
            build/sbom/bom.json
            build/release-notes.md
            build/consumer-matrix.log
          if-no-files-found: error
          retention-days: 90
      - name: Upload to Maven Central (USER_MANAGED) and wait for VALIDATED
        id: upload
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: python3 scripts/central-portal.py upload build/central-bundle.zip --name "openrouter-kotlin:$RELEASE_VERSION" --publishing-type USER_MANAGED --wait VALIDATED --timeout 1800
      - name: Consumer matrix against the validated deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment_id }}
        run: |
          export CENTRAL_TOKEN="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          bash scripts/consumer-matrix.sh --central-deployment "$DEPLOYMENT_ID" --version "$RELEASE_VERSION"
      - name: Publish (only when requested)
        if: ${{ inputs.publish }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment_id }}
        run: python3 scripts/central-portal.py publish "$DEPLOYMENT_ID" --wait PUBLISHED --timeout 3600

  github-release:
    needs: stage-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: "v${{ inputs.version }}"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-${{ inputs.version }}
          path: release
      - name: Create the (pre)release with bundle, inventory, and SBOM
        run: gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG" --notes-file release/release-notes.md release/central-bundle.zip release/publication-inventory.json release/bom.json
